services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vijay-jewellery-web
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3090:3000"
    volumes:
      - ./prisma:/app/prisma
      - ./app/data:/app/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:/app/prisma/dev.db
      - NEXT_PUBLIC_SITE_URL=https://vijayjewellery.shonku.site
    env_file:
      - .env

  caddy:
    image: caddy:2-alpine
    container_name: vijay-jewellery-caddy
    restart: unless-stopped
    profiles:
      - caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
